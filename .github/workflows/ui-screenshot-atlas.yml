name: UI Screenshot Atlas (complete redesign reference)

# Comprehensive visual capture of EVERY UI state for the redesign-reference
# atlas. Three variants:
#   landing-menus        = walk the landing page: top-bar icons (AI robot /
#                          buy / activate / save-scan), the FULL hamburger
#                          Drw_More_Menu row-by-row (settings/about/language/
#                          theme/update/share/...), every sidebar page (SD
#                          Card, More Recovery Tools, File Repair, Lost
#                          Partition Rescue, ChronoSnap), Select Folder picker
#   results-context      = after scan: right-click CONTEXT MENU
#                          (CShowContextMenu = Smart/Select/Recover/Preview/
#                          Location/Clear), view toggle, filter-bar Path +
#                          Type DROPDOWNS, search typing, row selection ->
#                          contextual Recover -> ChooseDestinationPathDialog
#   scan-phase-ui        = mid-scan, PAUSE state, resume, STOP confirm dialog,
#                          post-stop partial-results state
#
# All coordinates pixel-verified against captured evidence (see UIUX
# artifacts 24/30): window maximized at (0,0), ~1024x735 client on the
# 1024x768 runner desktop. Absolute coords offset from window origin.
on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: 'Seconds to wait for landing page'
        required: true
        default: '45'
      scan_wait:
        description: 'Seconds to wait for scan completion'
        required: true
        default: '940'
      midscan_wait:
        description: 'Seconds to wait for mid-scan captures'
        required: true
        default: '150'

permissions:
  contents: read

jobs:
  atlas:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: "landing-menus"
          - variant: "results-context"
          - variant: "scan-phase-ui"
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            og-codebase

      - name: Launch app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class AH {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint dw, UIntPtr e);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public static void Click(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
              mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
            }
            public static void RClick(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0008, 0, 0, 0, UIntPtr.Zero);
              mouse_event(0x0010, 0, 0, 0, UIntPtr.Zero);
            }
            public static void Esc() {
              keybd_event(0x1B, 0, 0, UIntPtr.Zero);
              keybd_event(0x1B, 0, 2, UIntPtr.Zero);
            }
          }
          "@
          Push-Location og-codebase
          $proc = Start-Process -FilePath ".\DRW.exe" -WorkingDirectory (Get-Location) -PassThru
          Pop-Location
          "launched pid=$($proc.Id)" | Out-File interaction_launch.txt -Encoding utf8
          Start-Sleep -Seconds ${{ inputs.wait_seconds }}
          "waited ${{ inputs.wait_seconds }}s" | Out-File interaction_launch.txt -Append -Encoding utf8

      - name: Run variant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $V = '${{ matrix.variant }}'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class AH2 {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint dw, UIntPtr e);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public static void Click(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
              mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
            }
            public static void RClick(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0008, 0, 0, 0, UIntPtr.Zero);
              mouse_event(0x0010, 0, 0, 0, UIntPtr.Zero);
            }
            public static void Esc() {
              keybd_event(0x1B, 0, 0, UIntPtr.Zero);
              keybd_event(0x1B, 0, 2, UIntPtr.Zero);
            }
          }
          "@
          function Shot($name) {
            try {
              Add-Type -AssemblyName System.Windows.Forms,System.Drawing
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
              $bmp.Save("shot_$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
              "captured shot_$name.png" | Write-Host
            } catch { "shot $name FAILED: $_" | Write-Host }
          }
          function Origin() {
            $drw = Get-Process DRWUI -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0} | Select-Object -First 1
            if (-not $drw) { return $null }
            $r = New-Object AH2+RECT
            [AH2]::GetWindowRect($drw.MainWindowHandle, [ref]$r) | Out-Null
            return $r
          }
          # absolute click: measured pixel position offset from window origin
          function AC($x, $y) {
            $r = Origin
            if ($r) {
              [AH2]::Click($r.L + $x, $r.T + $y)
              "click ($x,$y)+origin" | Write-Host
            } else { "AC: no window" | Write-Host }
          }
          function ARClick($x, $y) {
            $r = Origin
            if ($r) { [AH2]::RClick($r.L + $x, $r.T + $y); "rclick ($x,$y)+origin" | Write-Host }
            else { "ARClick: no window" | Write-Host }
          }
          function Esc2() { [AH2]::Esc(); Start-Sleep -Milliseconds 300; [AH2]::Esc(); Start-Sleep -Milliseconds 700 }
          function KillBrowsers() {
            Stop-Process -Name msedge, iexplore, microsoftedge -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 500
          }
          $log = @()
          $log += "=== variant: $V ==="

          # ---------------- LANDING + MENUS ----------------
          if ($V -eq 'landing-menus') {
            Shot "00_landing"
            $log += "landing baseline"
            # AI robot avatar (700,30)
            AC 700 30; Start-Sleep -Seconds 3; Shot "01_ai_robot_panel"; Esc2
            $log += "AI robot avatar clicked"
            # Buy / cart (754,30)
            AC 754 30; Start-Sleep -Seconds 4; Shot "02_buy"; Esc2; KillBrowsers
            $log += "buy/cart clicked"
            # Activate (794,30)
            AC 794 30; Start-Sleep -Seconds 3; Shot "03_activate"; Esc2
            $log += "activate clicked"
            # Save scan (834,30) - on landing with no session
            AC 834 30; Start-Sleep -Seconds 2; Shot "04_savescan_landing"; Esc2
            $log += "save-scan clicked (landing, no session)"
            # Hamburger menu open (874,30)
            AC 874 30; Start-Sleep -Seconds 2; Shot "05_menu_open"
            $log += "hamburger menu opened"
            Esc2
            # Menu row walk: menu anchored under hamburger, rows ~33px
            $rows = 65,100,135,170,205,240,275,310,345,380,415,450,485
            $i = 0
            foreach ($ry in $rows) {
              $i++
              Esc2; KillBrowsers
              AC 874 30; Start-Sleep -Milliseconds 900   # open menu
              AC 874 $ry; Start-Sleep -Seconds 3          # click row
              Shot "06_menu_row_$i`_y$ry"
              $log += "menu row $i (y=$ry) clicked"
            }
            # after menu walk return to clean landing
            Esc2; KillBrowsers; Start-Sleep -Seconds 2
            Shot "07_after_menu_walk"
            # Sidebar pages
            AC 135 112; Start-Sleep -Seconds 2; Shot "08_sidebar_harddisk"     # Hardware Disk (default)
            $log += "sidebar Hardware Disk"
            AC 135 162; Start-Sleep -Seconds 3; Shot "09_sidebar_sdcard"      # SD Card
            $log += "sidebar SD Card"
            AC 135 232; Start-Sleep -Seconds 3; Shot "10_sidebar_moretools"   # More Recovery Tools (14 tiles)
            $log += "sidebar More Recovery Tools"
            AC 135 392; Start-Sleep -Seconds 4; Shot "11_sidebar_filerepair"  # File Repair page
            $log += "sidebar File Repair"
            # repair page: blind click center (Add area) + two offsets
            AC 512 300; Start-Sleep -Seconds 3; Shot "12_filerepair_centerclick"; Esc2
            $log += "file-repair center click (add attempt)"
            AC 135 470; Start-Sleep -Seconds 3; Shot "13_sidebar_lostpartition" # Lost Partition Rescue
            $log += "sidebar Lost Partition Rescue"
            AC 135 618; Start-Sleep -Seconds 3; Shot "14_sidebar_chronosnap"   # ChronoSnap Backup
            $log += "sidebar ChronoSnap"
            # back to home
            AC 135 112; Start-Sleep -Seconds 2; Shot "15_back_home"
            # Select Folder tile (400,645) -> native folder picker
            AC 400 645; Start-Sleep -Seconds 3; Shot "16_selectfolder_picker"; Esc2
            $log += "Select Folder tile clicked (folder picker)"
            # Recycle Bin tile (400,490)
            AC 400 490; Start-Sleep -Seconds 2; Shot "17_recyclebin_tile"; Esc2
            $log += "Recycle Bin tile clicked"
          }

          # ---------------- RESULTS + CONTEXT MENU ----------------
          if ($V -eq 'results-context') {
            # start scan (blue CTA at 897,678)
            AC 897 678
            "scan clicked" | Write-Host
            Start-Sleep -Seconds ${{ inputs.scan_wait }}
            Shot "10_complete_modal"
            $log += "scan complete modal"
            # Go to Recover (celebration CTA - proven)
            $r = Origin
            if ($r) {
              $w = $r.R - $r.L; $h = $r.B - $r.T
              [AH2]::Click($r.L + [int]($w * 0.4824), $r.T + [int]($h * 0.6569))
            }
            Start-Sleep -Seconds 5
            Shot "20_results_baseline"
            $log += "results baseline (after Go to Recover)"
            # right-click a file row -> CShowContextMenu
            ARClick 600 350; Start-Sleep -Seconds 2
            Shot "21_context_menu"
            $log += "right-click context menu captured"
            Esc2
            # view toggle (list<->icon) at (667,80)
            AC 667 80; Start-Sleep -Seconds 2; Shot "22_view_toggle_iconview"
            $log += "view toggle clicked (icon view)"
            AC 667 80; Start-Sleep -Seconds 1   # toggle back
            # Filter button (737,80) -> filter bar
            AC 737 80; Start-Sleep -Seconds 2; Shot "23_filter_bar"
            $log += "filter bar toggled"
            # Path dropdown (72,160)
            AC 72 160; Start-Sleep -Seconds 2; Shot "24_filter_path_dropdown"
            $log += "filter Path dropdown"
            Esc2
            # Type dropdown (200,160)
            AC 200 160; Start-Sleep -Seconds 2; Shot "25_filter_type_dropdown"
            $log += "filter Type dropdown"
            Esc2
            # search box (886,80) - type text
            AC 886 80; Start-Sleep -Milliseconds 800
            [System.Windows.Forms.SendKeys]::SendWait('system')
            Start-Sleep -Seconds 3; Shot "26_search_typed"
            $log += "search typed 'system'"
            # clear search
            [AH2]::Esc(); Start-Sleep -Seconds 2
            # single-click a row -> selection + contextual Recover
            AC 600 350; Start-Sleep -Seconds 2; Shot "27_row_selected"
            $log += "row selected (contextual Recover button)"
            # Recover (bottom bar, ~892,668) -> ChooseDestinationPathDialog
            AC 892 668; Start-Sleep -Seconds 5; Shot "28_destination_dialog"
            $log += "Recover clicked -> destination dialog"
            # dialog internals: capture then blind-click browse-ish center-left
            AC 430 300; Start-Sleep -Seconds 3; Shot "29_destdlg_browseclick"
            Esc2
            # second row selection lower in list
            AC 600 500; Start-Sleep -Seconds 2; Shot "30_row2_selected"
            # tree: expand a Type-tree category
            AC 200 200; Start-Sleep -Seconds 2; Shot "31_tree_click"
            $log += "tree area clicked"
          }

          # ---------------- SCAN PHASE ----------------
          if ($V -eq 'scan-phase-ui') {
            AC 897 678
            "scan clicked" | Write-Host
            Start-Sleep -Seconds ${{ inputs.midscan_wait }}
            Shot "00_midscan_150s"
            $log += "mid-scan capture"
            Start-Sleep -Seconds 60
            Shot "01_midscan_210s"
            # PAUSE (104,698)
            AC 104 698; Start-Sleep -Seconds 3; Shot "02_paused"
            $log += "pause clicked"
            # resume
            AC 104 698; Start-Sleep -Seconds 3; Shot "03_resumed"
            $log += "pause toggled (resume)"
            # STOP (127,698) -> confirm dialog
            AC 127 698; Start-Sleep -Seconds 4; Shot "04_stop_confirm"
            $log += "stop clicked - confirm dialog"
            # confirm the stop (center of dialog area)
            AC 512 420; Start-Sleep -Seconds 4; Shot "05_after_stop_confirm"
            $log += "stop confirmed (partial results state?)"
            Start-Sleep -Seconds 5
            Shot "06_late_after_stop"
          }

          $log | Out-File interaction_log.txt -Encoding utf8
          Get-Content interaction_log.txt

      - name: Window census (user32)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Collections.Generic;
          public class WE {
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumWindowsProc cb, IntPtr lp);
            [DllImport("user32.dll")] static extern int GetWindowText(IntPtr h, StringBuilder sb, int n);
            [DllImport("user32.dll")] static extern int GetClassName(IntPtr h, StringBuilder sb, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            delegate bool EnumWindowsProc(IntPtr h, IntPtr lp);
            public static List<string> Results = new List<string>();
            static bool Cb(IntPtr h, IntPtr lp) {
              uint pid; GetWindowThreadProcessId(h, out pid);
              if (IsWindowVisible(h)) {
                var t = new StringBuilder(256); GetWindowText(h, t, 256);
                var c = new StringBuilder(256); GetClassName(h, c, 256);
                RECT r; GetWindowRect(h, out r);
                if (t.Length > 0)
                  Results.Add(string.Format("pid={0} hwnd=0x{1:X} class={2} title={3} rect=({4},{5})-({6},{7})",
                    pid, h.ToInt64(), c, t, r.L, r.T, r.R, r.B));
              }
              return true;
            }
            public static void Go() { EnumWindows(Cb, IntPtr.Zero); }
          }
          "@
            [WE]::Go()
            [WE]::Results | ForEach-Object { Write-Host $_ }
            [WE]::Results | Out-File windows_census.txt -Encoding utf8
          } catch {
            Write-Host "user32 enum failed: $_"
            "user32-enum-failed: $_" | Out-File windows_census.txt -Encoding utf8
          }
          Get-Process | Where-Object {$_.ProcessName -match 'DRW|EaseUS|EU|msedge'} |
            Select-Object Id,ProcessName,MainWindowTitle,MainWindowHandle |
            Format-Table -AutoSize | Out-File processes.txt -Encoding utf8

      - name: App logs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ChildItem "og-codebase/*.log" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName ("applog_" + $_.Name) -ErrorAction Continue }
          Get-ChildItem "og-codebase/Eaolog*" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName ("applog_" + $_.Name) -ErrorAction Continue }
          Get-ChildItem "og-codebase/log" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName ("applog_log_" + $_.Name) -ErrorAction Continue }

      - name: Upload atlas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-atlas-${{ matrix.variant }}
          path: |
            interaction_launch.txt
            interaction_log.txt
            windows_census.txt
            processes.txt
            shot_*.png
            applog_*
          if-no-files-found: ignore
