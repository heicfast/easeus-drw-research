name: UI Dynamic Ground-Truth (Wine screenshot + window census)

# Runs DRWUI.exe under Wine + Xvfb on an Ubuntu runner, enumerates top-level
# windows (titles + geometry) and captures screenshots — runtime verification
# of the decoded UI flow (landing page, window titles, dialog inventory).
on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: 'Seconds to let the app run before capture'
        required: true
        default: '60'

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            og-codebase

      - name: Install Wine + Xvfb + tools
        shell: bash
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 xvfb x11-utils imagemagick wmctrl x11-apps fonts-dejavu procps || true
          wine --version || /usr/lib/wine/wine64 --version || true

      - name: Launch DRWUI under Wine + Xvfb
        shell: bash
        run: |
          export WINEPREFIX="$HOME/.wine32prefix"
          export WINEDEBUG=-all
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 3
          cd og-codebase
          # init wine prefix quietly
          wineserver -k || true
          (wine DRWUI.exe > /tmp/wine_out.log 2>&1 &)
          sleep ${{ inputs.wait_seconds }}
          echo "=== wine stdout/stderr ==="; tail -50 /tmp/wine_out.log || true
          ps aux | grep -iE 'wine|DRW|services' | grep -v grep | head -20

      - name: Window census (xwininfo + wmctrl)
        shell: bash
        run: |
          export DISPLAY=:99
          echo "=== wmctrl -l ===" > windows_census.txt
          wmctrl -l >> windows_census.txt 2>&1 || true
          echo "" >> windows_census.txt
          echo "=== xwininfo -root -tree (top 3 levels) ===" >> windows_census.txt
          xwininfo -root -tree >> windows_census.txt 2>&1 || true
          head -120 windows_census.txt
          echo "=== wine processes ==="
          wineserver -p || true

      - name: Screenshots
        shell: bash
        run: |
          export DISPLAY=:99
          import -window root screen_main.png 2>/tmp/shot_err.log || {
            # fallback: xwd + convert
            xwd -root -out /tmp/root.xwd 2>>/tmp/shot_err.log && convert /tmp/root.xwd screen_main.png 2>>/tmp/shot_err.log
          }
          sleep 10
          import -window root screen_late.png 2>>/tmp/shot_err.log || true
          cat /tmp/shot_err.log || true
          ls -la *.png 2>/dev/null || echo "no screenshots"

      - name: Wine logs + app logs
        shell: bash
        run: |
          cp /tmp/wine_out.log wine_out.log 2>/dev/null || true
          cp og-codebase/Eaolog.log applog_Eaolog.log 2>/dev/null || true
          cp og-codebase/EPMLOG.log applog_EPMLOG.log 2>/dev/null || true
          cp og-codebase/strutureReg.log applog_structureReg.log 2>/dev/null || true
          ls -la og-codebase/*.log 2>/dev/null || true
          # wine debug channels dump if anything
          find "$HOME/.wine32prefix" -name "*.log" 2>/dev/null | head -5 || true

      - name: Upload ground truth
        uses: actions/upload-artifact@v4
        with:
          name: ui-ground-truth-wine
          path: |
            windows_census.txt
            wine_out.log
            screen_main.png
            screen_late.png
            applog_*.log
          if-no-files-found: ignore
