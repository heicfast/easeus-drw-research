name: UI Dynamic Ground-Truth (Windows screenshot + window census)

# Runs DRWUI.exe on a real Windows runner, enumerates all top-level windows
# (titles + classes) and captures screenshots. Verifies the decoded UI flow
# (landing page, window titles, dialog inventory) against runtime ground truth.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to run: drwui | drw | none'
        required: true
        default: 'drwui'
      wait_seconds:
        description: 'Seconds to let the app run before capture'
        required: true
        default: '45'
      click_scan:
        description: 'Click Search-for-Lost-Data button (scan phase capture): yes | no'
        required: true
        default: 'no'
      scan_wait:
        description: 'Seconds to wait after the click'
        required: true
        default: '75'

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            og-codebase

      - name: Launch app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $app = '${{ inputs.app }}'
          $wait = [int]'${{ inputs.wait_seconds }}'
          Push-Location og-codebase
          if ($app -eq 'drw') {
            $proc = Start-Process -FilePath ".\DRW.exe" -PassThru
          } else {
            $proc = Start-Process -FilePath ".\DRWUI.exe" -WorkingDirectory (Get-Location) -PassThru
          }
          Pop-Location
          "launched pid=$($proc.Id) exe=$($proc.ProcessName)" | Out-File launch.txt -Encoding utf8
          Start-Sleep -Seconds $wait
          Get-Process | Where-Object {$_.ProcessName -match 'DRW|EaseUS|EU'} |
            Select-Object Id,ProcessName,MainWindowTitle,MainWindowHandle |
            Format-Table -AutoSize | Out-File processes.txt -Encoding utf8
          Get-Process | Out-File all_processes.txt -Encoding utf8

      - name: Click Search-for-Lost-Data (scan phase)
        if: inputs.click_scan == 'yes'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class ClickHelper {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint dwFlags, uint dx, uint dy, uint dwData, UIntPtr dwExtraInfo);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public static void Click(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero); // LEFTDOWN
              mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero); // LEFTUP
            }
          }
          "@
          $drw = Get-Process DRWUI -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0} | Select-Object -First 1
          if ($drw) {
            $r = New-Object ClickHelper+RECT
            [ClickHelper]::GetWindowRect($drw.MainWindowHandle, [ref]$r) | Out-Null
            $w = $r.R - $r.L; $h = $r.B - $r.T
            # 'Search for Lost Data' = bottom-right of the landing page (~0.9w, 0.92h)
            $cx = $r.L + [int]($w * 0.90); $cy = $r.T + [int]($h * 0.92)
            "clicking at ($cx,$cy) window ${w}x${h}" | Write-Host
            [ClickHelper]::Click($cx, $cy)
            "clicked at ($cx,$cy)" | Out-File click.txt -Encoding utf8
          } else { "no DRWUI window" | Out-File click.txt -Encoding utf8 }
          Start-Sleep -Seconds ${{ inputs.scan_wait }}

      - name: Window census (user32)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Collections.Generic;
          public class WinEnum2 {
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumWindowsProc cb, IntPtr lp);
            [DllImport("user32.dll")] static extern int GetWindowText(IntPtr h, StringBuilder sb, int n);
            [DllImport("user32.dll")] static extern int GetClassName(IntPtr h, StringBuilder sb, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            delegate bool EnumWindowsProc(IntPtr h, IntPtr lp);
            public static List<string> Results = new List<string>();
            static bool Cb(IntPtr h, IntPtr lp) {
              uint pid; GetWindowThreadProcessId(h, out pid);
              if (IsWindowVisible(h)) {
                var t = new StringBuilder(256); GetWindowText(h, t, 256);
                var c = new StringBuilder(256); GetClassName(h, c, 256);
                RECT r; GetWindowRect(h, out r);
                if (t.Length > 0)
                  Results.Add(string.Format("pid={0} hwnd=0x{1:X} class={2} title={3} rect=({4},{5})-({6},{7})",
                    pid, h.ToInt64(), c, t, r.L, r.T, r.R, r.B));
              }
              return true;
            }
            public static void Go() { EnumWindows(Cb, IntPtr.Zero); }
          }
          "@
            [WinEnum2]::Go()
            [WinEnum2]::Results | ForEach-Object { Write-Host $_ }
            [WinEnum2]::Results | Out-File windows_census.txt -Encoding utf8
          } catch {
            Write-Host "user32 enum failed: $_"
            "user32-enum-failed: $_" | Out-File windows_census.txt -Encoding utf8
          }

      - name: Screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            "screen: $($b.Width)x$($b.Height)" | Write-Host
            $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
            $bmp.Save("screen_main.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            "main screenshot ok" | Out-File shot_status.txt -Encoding utf8
          } catch {
            Write-Host "screenshot failed: $_"
            "screenshot-failed: $_" | Out-File shot_status.txt -Encoding utf8
          }
          Start-Sleep -Seconds 15
          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
            $bmp.Save("screen_late.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          } catch { Write-Host "late shot failed: $_" }

      - name: Process crash info + app logs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-EventLog -LogName Application -Newest 30 -ErrorAction SilentlyContinue |
            Where-Object {$_.Message -match 'DRW|EaseUS'} |
            Select-Object TimeGenerated,EntryType,Message |
            Out-File eventlog.txt -Encoding utf8
          Get-ChildItem "og-codebase/*.log" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName ("applog_" + $_.Name) -ErrorAction Continue }
          if (Test-Path "og-codebase/Eaolog.log") { Copy-Item "og-codebase/Eaolog.log" applog_Eaolog.log }
          if (Test-Path "og-codebase/EPMLOG.log") { Copy-Item "og-codebase/EPMLOG.log" applog_EPMLOG.log }
          "HKCU EaseUS:" | Out-File reg_hkcu.txt -Encoding utf8
          Get-ChildItem "HKCU:\SOFTWARE" -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'EaseUS|Foxit'} | Out-File reg_hkcu.txt -Append -Encoding utf8

      - name: Upload ground truth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ground-truth
          path: |
            launch.txt
            click.txt
            processes.txt
            all_processes.txt
            windows_census.txt
            screen_main.png
            screen_late.png
            shot_status.txt
            eventlog.txt
            applog_*.log
            reg_hkcu.txt
          if-no-files-found: ignore
